[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usuitrack"
version = "0.1.0"
description = "A memory-efficient matrix optimizer for consumer-GPU fine-tuning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Daniel Jonas Gaderbauer" }]
dependencies = ["torch>=2.1"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["pytorch", "torch", "optimizer", "muon", "low-rank", "fine-tuning"]

[project.urls]
Repository = "https://github.com/Nelathan/usuitrack"

[dependency-groups]
dev = ["pytest>=8.0"]
lab = [
    "transformers>=5.12.0",
    "pyarrow>=24.0.0",
    "huggingface-hub>=1.19.0",
    "wandb>=0.23.0",
    "peft>=0.19.1",
    "cut-cross-entropy>=25.1.1",
    "flash-linear-attention>=0.5.0",
    "causal-conv1d==1.6.2.post1",
]

[tool.uv]
default-groups = ["dev", "lab"]
# causal-conv1d's CUDA extension is built for one torch. Torch and
# causal-conv1d are pinned to the pair that loads, and its build sees the
# runtime torch; any other pairing tried failed on an undefined c10 symbol.
constraint-dependencies = ["torch==2.12.0"]
extra-build-dependencies = { causal-conv1d = [{ requirement = "torch", match-runtime = true }] }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["usuitrack*"]
